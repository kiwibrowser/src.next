# Build APKs for Kiwi Browser Next
name: 'Any branch: Build APK'

# Controls when the action will run. Triggers the workflow on pull request events or manual trigger
on:
  pull_request:
    branches:
      - kiwi
  workflow_dispatch:

concurrency: build_test_apk

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git curl wget
          
      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Sync Chromium dependencies
        run: |
          gclient sync --nohooks

      - name: Run hooks
        run: |
          gclient runhooks

      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          gn gen out/Release --args='target_os="android" target_cpu="arm64" is_debug=false is_official_build=true'
          autoninja -C out/Release chrome_public_apk

      - name: Rename APK
        run: |
          cp out/Release/apks/ChromePublic.apk out.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-browser-apk
          path: out.apk
          retention-days: 30

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v4.8

      - name: Creating release
        if: github.event_name != 'pull_request'
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_id }}
          release_name: Test build ${{ github.run_id }} initiated by ${{ github.actor }}
          draft: true
          prerelease: true
          body: |
            This is a test build initiated by ${{ github.actor }}.
            Built on GitHub Actions runners.

      - name: Uploading test apk (arm64)
        if: github.event_name != 'pull_request'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./out.apk
          asset_name: ${{ github.repository_owner }}.${{ github.event.repository.name }}.${{ steps.branch-name.outputs.current_branch }}.${{ github.run_id }}-unofficial-arm64.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Displaying result
        run: echo "Build completed successfully! APK available in artifacts and release."

