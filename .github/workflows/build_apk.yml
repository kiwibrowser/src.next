# Build APKs for Kiwi Browser Next
name: 'Any branch: Build APK'

# Controls when the action will run
on:
  pull_request:
    branches:
      - kiwi
  workflow_dispatch:

concurrency: build_test_apk

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize build space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          echo "After cleanup:"
          df -h

      - name: Checkout latest Chromium
        uses: actions/checkout@v4
        with:
          ref: chromium
          path: src
          fetch-depth: 1

      - name: Checkout Kiwi modifications
        uses: actions/checkout@v4
        with:
          ref: kiwi
          path: kiwi-src
          fetch-depth: 1

      - name: Create .gn file for GN build system
        run: |
          # Create .gn file in src directory (required by GN to identify source root)
          cat > src/.gn << 'EOF'
          buildconfig = "//build/config/BUILDCONFIG.gn"

          script_executable = "python3"

          root = "//"
          EOF
          echo "Created .gn file in src directory"

      - name: Load Chromium version
        run: |
          if [ -f "src/CHROMIUM_VERSION" ]; then
            source src/CHROMIUM_VERSION
            while IFS= read -r var; do
              export "$var"
            done < <(cut -d= -f1 src/CHROMIUM_VERSION | grep -vF '#')
            env | grep -F CHROMIUM_ >> "$GITHUB_ENV"
            echo "Building Chromium ${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip git curl wget \
            build-essential ninja-build pkg-config \
            libnss3-dev libglib2.0-dev libgtk-3-dev \
            libatk1.0-dev libatk-bridge2.0-dev \
            libcups2-dev libdrm-dev libxkbcommon-dev \
            libgbm-dev libasound2-dev

      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "${GITHUB_WORKSPACE}/depot_tools" >> "$GITHUB_PATH"

      - name: Configure gclient for Chromium
        run: |
          export PATH="${GITHUB_WORKSPACE}/depot_tools:$PATH"
          # Ensure required directories exist
          mkdir -p src/build/config
          mkdir -p src/third_party
          
          # Create .gclient file - source already checked out, just need dependencies
          cat > .gclient << 'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": True,
              },
            },
          ]
          target_os = ["android"]
          EOF

      - name: Sync Chromium dependencies
        run: |
          export PATH="${GITHUB_WORKSPACE}/depot_tools:$PATH"
          # Sync only dependencies (source already checked out from chromium branch)
          gclient sync -D --no-history --shallow --nohooks
          
      - name: Run essential build hooks
        run: |
          export PATH="${GITHUB_WORKSPACE}/depot_tools:$PATH"
          # Run hooks but allow non-critical failures
          cd src
          python3 build/landmines.py || true
          python3 build/util/lastchange.py -o build/util/LASTCHANGE || true
          # Install sysroots for both host (amd64) and target (arm64)
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64 || true
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=arm64 || true
          python3 tools/clang/scripts/update.py || true

      - name: Apply Kiwi modifications
        run: |
          # Copy Kiwi-specific modifications including extensions support
          echo "Applying Kiwi modifications from kiwi branch to latest chromium"
          
          # Copy Kiwi-only directories (not in vanilla Chromium)
          echo "Copying Kiwi-specific directories..."
          cp -r kiwi-src/.build src/ 2>/dev/null || echo ".build not found"
          cp -r kiwi-src/toolbox src/ 2>/dev/null || echo "toolbox not found"
          cp -r kiwi-src/local_scripts src/ 2>/dev/null || echo "local_scripts not found"
          
          # Copy entire extensions directory (Kiwi's main feature)
          echo "Copying extensions support..."
          rsync -av --progress kiwi-src/extensions/ src/extensions/ 2>/dev/null || echo "extensions not found"
          
          # Copy chrome modifications (includes Android extensions UI)
          echo "Copying Chrome modifications..."
          rsync -av --progress kiwi-src/chrome/android/ src/chrome/android/ 2>/dev/null || echo "chrome/android not found"
          rsync -av --progress kiwi-src/chrome/browser/extensions/ src/chrome/browser/extensions/ 2>/dev/null || echo "chrome/browser/extensions not found"
          rsync -av --progress kiwi-src/chrome/browser/ui/android/ src/chrome/browser/ui/android/ 2>/dev/null || echo "chrome/browser/ui/android not found"
          
          # Copy components modifications
          echo "Copying components modifications..."
          rsync -av --progress kiwi-src/components/ src/components/ 2>/dev/null || echo "components not found"
          
          # Copy content modifications
          echo "Copying content modifications..."
          rsync -av --progress kiwi-src/content/ src/content/ 2>/dev/null || echo "content not found"
          
          # Copy UI modifications
          echo "Copying UI modifications..."
          rsync -av --progress kiwi-src/ui/ src/ui/ 2>/dev/null || echo "ui not found"
          
          # Copy build files and configurations
          echo "Copying build configurations..."
          find kiwi-src -maxdepth 2 -name "BUILD.gn" -o -name "*.gni" | while read file; do
            rel_path="${file#kiwi-src/}"
            if [ -f "$file" ]; then
              mkdir -p "src/$(dirname "$rel_path")"
              cp "$file" "src/$rel_path"
            fi
          done
          
          # Copy version files
          cp kiwi-src/KIWI_VERSION src/ 2>/dev/null || echo "KIWI_VERSION not found"
          cp kiwi-src/VERSION src/ 2>/dev/null || echo "VERSION not found"
          
          echo "Kiwi modifications applied successfully"
          echo "Checking extensions support:"
          ls -la src/extensions/ | head -20
          ls -la src/.build/ 2>/dev/null || echo "No .build directory"

      - name: Configure build
        run: |
          export PATH="${GITHUB_WORKSPACE}/depot_tools:$PATH"
          cd src
          # Use minimal working configuration for Android
          gn gen out/Default --args='
            target_os="android"
            target_cpu="arm64"
            is_debug=false
            is_component_build=false
            symbol_level=0
            ffmpeg_branding="Chrome"
            proprietary_codecs=true
            enable_nacl=false
            android_channel="stable"
          '

      - name: Build APK
        run: |
          export PATH="${GITHUB_WORKSPACE}/depot_tools:$PATH"
          cd src
          autoninja -C out/Default chrome_public_apk

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp src/out/Default/apks/*.apk artifacts/ || true
          ls -lah artifacts/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-browser-apk-${{ github.run_id }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v4.8

      - name: Create release
        if: github.event_name != 'pull_request'
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_id }}
          release_name: Build ${{ github.run_id }} by ${{ github.actor }}
          draft: true
          prerelease: true
          body: |
            Automated build initiated by ${{ github.actor }}
            Branch: ${{ steps.branch-name.outputs.current_branch }}
            Commit: ${{ github.sha }}
            Built on GitHub Actions

      - name: Upload release asset
        if: github.event_name != 'pull_request'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/ChromePublic.apk
          asset_name: KiwiBrowser-${{ steps.branch-name.outputs.current_branch }}-${{ github.run_id }}-arm64.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Build summary
        run: |
          {
            echo "### Build Summary :rocket:"
            echo "- **Chromium Version:** ${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}"
            echo "- **Branch:** ${{ steps.branch-name.outputs.current_branch }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Run ID:** ${{ github.run_id }}"
            echo "- **Artifacts:** Available in workflow artifacts"
          } >> "$GITHUB_STEP_SUMMARY"

